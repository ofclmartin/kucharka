<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kuchárka">
<link rel="manifest" href="manifest.webmanifest">
<script src="config.js"></script>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
/* téma ešte pred vykreslením, aby stránka neblikla */
(function(){ var t; try{ t=JSON.parse(localStorage.getItem('kucharka-theme')); }catch(e){ try{ t=localStorage.getItem('kucharka-theme'); }catch(e2){} }
  var dark = t==='dark' || (t!=='light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  if(t==='dark'||t==='light') document.documentElement.setAttribute('data-theme', t);
  document.write('<meta name="apple-mobile-web-app-status-bar-style" content="'+(dark?'black':'default')+'">');
  document.write('<meta name="theme-color" content="'+(dark?'#000000':'#F2F2F7')+'">');
})();
</script>
<title>Fit Kuchárka</title>
<style>
/* Layout: iOS-style — veľký titulok, plávajúce „sklenené“ lišty (horná + tab bar kapitol), zoskupené zoznamy; editor ako sheet */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --fill:rgba(118,118,128,.12); --label:#000000; --label2:rgba(60,60,67,.62); --label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.16); --tint:#007AFF; --red:#FF3B30; --seg-on:#FFFFFF;
  --glass:rgba(255,255,255,.66); --glass-brd:rgba(255,255,255,.85); --glass-sh:0 10px 30px rgba(0,0,0,.10), 0 1px 2px rgba(0,0,0,.06);
  --c-ranajky:#FF9500; --c-desiata:#34C759; --c-obed:#FF3B30; --c-olovrant:#AF52DE; --c-vecera:#5856D6; --c-all:#007AFF;
  --p:#0A84FF; --s:#FFB300; --t:#FF2D55;
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", system-ui, "Segoe UI", Roboto, sans-serif;
  --rl:22px; --rm:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --fill:rgba(118,118,128,.24); --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.55); --tint:#0A84FF; --red:#FF453A; --seg-on:#636366;
  --glass:rgba(44,44,48,.6); --glass-brd:rgba(255,255,255,.12); --glass-sh:0 10px 30px rgba(0,0,0,.5);
  --c-ranajky:#FF9F0A; --c-desiata:#30D158; --c-obed:#FF453A; --c-olovrant:#BF5AF2; --c-vecera:#5E5CE6; --c-all:#0A84FF; color-scheme:dark; }}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --fill:rgba(118,118,128,.24); --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.55); --tint:#0A84FF; --red:#FF453A; --seg-on:#636366;
  --glass:rgba(44,44,48,.6); --glass-brd:rgba(255,255,255,.12); --glass-sh:0 10px 30px rgba(0,0,0,.5);
  --c-ranajky:#FF9F0A; --c-desiata:#30D158; --c-obed:#FF453A; --c-olovrant:#BF5AF2; --c-vecera:#5E5CE6; --c-all:#0A84FF; color-scheme:dark; }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--label);font:17px/1.4 var(--font);letter-spacing:-.01em;margin:0;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px;border-radius:8px}
svg{display:block}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px;padding-block:0 140px}
h1,h2,h3{margin:0;text-wrap:balance}

/* glass */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--glass-brd);box-shadow:var(--glass-sh)}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:10px 0;margin-inline:-20px;padding-inline:16px;transition:background .2s}
.topbar.scrolled{background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border-bottom:.5px solid var(--sep)}
.topbar .mid{font-weight:600;font-size:17px;opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.topbar.scrolled .mid{opacity:1}
.topbar .l{justify-self:start}.topbar .r{justify-self:end;display:flex;gap:8px}
.gbtn{height:44px;min-width:44px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;font-weight:600;color:var(--label)}
.gbtn.round{padding:0;width:44px}
.gbtn svg{width:22px;height:22px}
.gbtn.tint{color:var(--tint)}

/* large title */
.large{padding:6px 0 18px}
.date{font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.02em}
.large h1{font-size:clamp(34px,6vw,44px);font-weight:700;letter-spacing:-.025em;line-height:1.1;margin-top:2px}
.searchf{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:12px;padding:0 12px;height:40px;margin-bottom:22px}
.searchf svg{width:17px;height:17px;color:var(--label2);flex:none}
.searchf input{border:0;background:none;outline:0;flex:1;min-width:0;font-size:17px;height:100%}
.searchf input::placeholder{color:var(--label2)}

/* grouped lists */
.gtitle{font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:.02em;padding:0 16px 7px}
.gfoot{font-size:13px;color:var(--label2);padding:7px 16px 0;margin:0}
.group{background:var(--card);border-radius:var(--rl);overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;min-height:50px;padding:8px 16px;position:relative;width:100%;text-align:left}
.cell + .cell::before{content:"";position:absolute;top:0;right:0;left:var(--inset,16px);height:1px;background:var(--sep);transform:scaleY(.6)}
button.cell:active,.cell.tap:active{background:var(--fill)}
.cell .grow{flex:1;min-width:0}
.cell .sub{color:var(--label2)}
.chev{width:9px;height:14px;color:var(--label3);flex:none}
.ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none;background:var(--cc)}
.ico svg{width:19px;height:19px}
.block{margin-bottom:28px}

/* section headers + carousel */
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 10px}
.sechead h2{font-size:22px;font-weight:700;letter-spacing:-.02em}
.sechead button{color:var(--tint);font-size:17px}
.carousel{display:grid;grid-auto-flow:column;grid-auto-columns:min(270px,72%);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-20px;padding:2px 20px 10px;scroll-padding-inline:20px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.carousel > *{scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:16px}
@media (max-width:520px){ .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px} .grid .card h3{font-size:15px} .grid .card .meta{font-size:12px;gap:8px} .grid .card-body{padding:10px 12px 12px} }

/* recipe rows */
.rows{--inset:136px}
.rrow{gap:14px;padding-block:10px;min-height:84px}
.rrow .no{width:22px;flex:none;text-align:right;font-size:17px;font-weight:700;color:var(--label2)}
.rrow .th{width:64px;height:64px;flex:none;border-radius:14px;overflow:hidden}
.rrow .th .ph{aspect-ratio:auto;height:100%}
.rrow .th .fb svg{width:52%}
.rrow .t{display:-webkit-box;font-size:17px;font-weight:600;letter-spacing:-.015em;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rrow .meta{margin-top:3px;gap:4px 10px}
.rrow .meta .hl{color:var(--cc);font-weight:600}
.rrow .meta .hl b{color:inherit}
.exb{font-size:11px;font-weight:600;color:var(--label2);background:var(--fill);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.sortbar{display:flex;align-items:center;gap:10px;margin:-8px 0 22px;flex-wrap:wrap}
.sortbar .lbl{font-size:15px;color:var(--label2)}
.sortpill{position:relative;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 14px;border-radius:999px;background:var(--fill);color:var(--label);font-size:15px;font-weight:600;cursor:pointer}
.sortpill svg{width:10px;height:14px;color:var(--label2);flex:none}
.sortpill select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px;appearance:none;-webkit-appearance:none;border:0}
.sortpill:has(select:focus-visible){outline:2px solid var(--tint);outline-offset:2px}
.sortbar .sel{font-size:15px;font-weight:600;max-width:none;background-color:var(--fill);border-radius:999px;padding:7px 28px 7px 14px;background-position:right 16px center,right 11px center}
@media (max-width:420px){ .rows{--inset:122px} .rrow{gap:10px} .rrow .th{width:56px;height:56px} .rrow .no{width:18px;font-size:15px} }

/* cards */
.card{display:flex;flex-direction:column;background:var(--card);border-radius:var(--rl);overflow:hidden;text-align:left;transition:transform .2s ease;min-width:0}
.card:active{transform:scale(.97)}
.ph{aspect-ratio:4/3;width:100%;max-width:100%;position:relative;overflow:hidden;background:var(--fill)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .fb{position:absolute;inset:0;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,color-mix(in srgb,var(--cc) 78%,#fff),var(--cc))}
.ph .fb svg{width:30%;max-width:110px;opacity:.9}
.pill{position:absolute;left:10px;top:10px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;color:var(--label)}
.pill.ex{left:auto;right:10px}
.card-body{padding:12px 14px 14px;display:grid;gap:4px;min-width:0}
.card h3{font-size:17px;font-weight:600;letter-spacing:-.015em;line-height:1.25}
.meta{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--label2)}
.meta b{color:var(--label);font-weight:600}
.empty{text-align:center;padding:40px 20px;color:var(--label2)}
.empty h3{color:var(--label);font-size:22px;margin-bottom:6px}

/* detail */
.detail{max-width:1000px;margin:0 auto}
.dhead{display:grid;grid-template-columns:300px minmax(0,1fr);gap:32px;align-items:center;margin:8px 0 36px}
.hero .ph{aspect-ratio:1/1;border-radius:28px}
.dinfo .tiles{margin-bottom:0}
.dbody{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:32px;align-items:start}

.kicker{font-size:15px;font-weight:600;color:var(--cc)}
.detail h1{font-size:clamp(30px,5vw,40px);font-weight:700;letter-spacing:-.025em;line-height:1.1;margin:2px 0 8px}
.intro{color:var(--label2);margin:0 0 20px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:22px}
.tile{background:var(--card);border-radius:18px;padding:12px;display:grid;gap:4px;min-width:0}
.tile svg{width:18px;height:18px;color:var(--cc)}
.tile strong{font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.tile strong small{font-size:13px;font-weight:600;color:var(--label2)}
.tile span{font-size:12px;color:var(--label2)}
.nutri{background:var(--card);border-radius:var(--rl);padding:18px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;margin-bottom:28px}
.rings{width:132px;height:132px}
.rings svg{width:100%;height:100%;transform:rotate(-90deg)}
.kcal{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1}
.kcal small{font-size:17px;color:var(--label2);font-weight:600}
.legend{display:grid;gap:8px;margin-top:12px}
.lg{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;font-size:15px}
.lg i{width:10px;height:10px;border-radius:50%}
.lg b{font-weight:600}
.lg em{font-style:normal;color:var(--label2);font-size:13px;margin-left:6px}
.nfoot{grid-column:1/-1;font-size:13px;color:var(--label2);border-top:1px solid var(--sep);padding-top:10px}
.stepper{display:inline-flex;align-items:center;background:var(--fill);border-radius:10px;height:34px;overflow:hidden}
.stepper button{width:44px;height:34px;display:grid;place-items:center;font-size:22px;font-weight:500;color:var(--label)}
.stepper button + button,.stepper .val + button{border-left:1px solid var(--sep)}
.stepper .val{min-width:44px;padding:0 6px;text-align:center;font-size:15px;font-weight:600}
.ingc .chk{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--label3);display:grid;place-items:center;flex:none;color:#fff}
.ingc .chk svg{width:14px;height:14px;opacity:0}
.ingc.done .chk{background:var(--cc);border-color:var(--cc)}
.ingc.done .chk svg{opacity:1}
.ingc.done .grow{color:var(--label2);text-decoration:line-through}
.amt{text-align:right;font-weight:600;white-space:nowrap}
.amt small{display:block;font-weight:400;color:var(--label2);font-size:13px}
.stepc{align-items:flex-start;padding-block:14px}
.stepc .no{width:28px;height:28px;border-radius:50%;background:var(--cc);color:#fff;font-weight:700;font-size:15px;display:grid;place-items:center;flex:none}
.tip{background:color-mix(in srgb,var(--cc) 14%,var(--card));border-radius:var(--rl);padding:16px 18px}
.tip b{color:var(--cc)}

/* tab bar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:30;display:flex;gap:2px;padding:5px;border-radius:999px;max-width:calc(100% - 24px)}
.tab{display:grid;justify-items:center;gap:1px;padding:6px 8px;border-radius:999px;font-size:10px;font-weight:600;color:var(--label);min-width:52px}
.tab svg{width:23px;height:23px}
.tab[aria-pressed="true"]{color:var(--cc);background:var(--fill)}
@media (max-width:440px){ .tab{min-width:0;padding:6px 5px;font-size:9.5px} .tab svg{width:21px;height:21px} .tabbar{gap:0;padding:4px} }

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;animation:fadein .25s ease}
.sheet{position:fixed;z-index:41;left:50%;transform:translateX(-50%);top:4vh;bottom:4vh;width:min(680px,calc(100% - 32px));background:var(--bg);border-radius:28px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:up .32s cubic-bezier(.2,.9,.25,1)}
@media (max-width:700px){ .sheet{top:calc(env(safe-area-inset-top,0px) + 10px);bottom:0;width:100%;border-radius:22px 22px 0 0} }
.sheet-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid transparent}
.sheet-head.scrolled{border-bottom-color:var(--sep)}
.sheet-head h2{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.sheet-head .l{justify-self:start}.sheet-head .r{justify-self:end}
.sheet-head .gbtn{height:40px}
.sheet-head .save{background:var(--tint);color:#fff;border-color:transparent}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:8px 16px calc(40px + env(safe-area-inset-bottom,0px))}
.sheet-body .block{margin-bottom:24px}
@keyframes up{from{transform:translate(-50%,40px);opacity:.4}to{transform:translate(-50%,0);opacity:1}}
@keyframes fadein{from{opacity:0}}
body.locked{overflow:hidden}

/* form cells */
.in{border:0;background:none;outline:0;font-size:17px;min-width:0;width:100%;padding:6px 0;color:var(--label)}
.in::placeholder{color:var(--label3)}
.in.right{text-align:right}
textarea.in{resize:none;line-height:1.4;overflow:hidden;display:block}
.lbl{flex:none;color:var(--label)}
.unit{color:var(--label2);flex:none}
.cell .narrow{width:76px;flex:none}
.photo-tile{display:block;position:relative;border-radius:var(--rl);overflow:hidden;cursor:pointer}
.photo-tile .ph{aspect-ratio:16/10}
.photo-tile .gbtn{position:absolute;right:12px;bottom:12px;height:38px;font-size:15px}
.linkbtn{color:var(--tint);font-size:15px;padding:8px 4px}
.cats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.catb{background:var(--card);border-radius:16px;padding:10px 4px;display:grid;justify-items:center;gap:6px;font-size:12px;font-weight:600;border:2px solid transparent}
.catb .ico{width:34px;height:34px;border-radius:10px}
.catb[aria-pressed="true"]{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 12%,var(--card))}
.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px;flex:none}
.seg button{padding:5px 12px;border-radius:7px;font-size:14px;font-weight:500;min-width:40px}
.seg button[aria-pressed="true"]{background:var(--seg-on);font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.seg.full{display:grid;grid-template-columns:repeat(3,1fr);width:100%}
.sel{appearance:none;-webkit-appearance:none;border:0;background:none;color:var(--tint);font-size:16px;text-align:right;padding:6px 18px 6px 0;max-width:150px;outline:0;background-image:linear-gradient(45deg,transparent 50%,var(--tint) 50%),linear-gradient(135deg,var(--tint) 50%,transparent 50%);background-position:right 6px center,right 1px center;background-size:5px 5px;background-repeat:no-repeat}
.minus{width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;flex:none}
.minus svg{width:12px;height:12px}
.addc{color:var(--tint);font-weight:500}
.addc .plus{width:24px;height:24px;border-radius:50%;background:#34C759;color:#fff;display:grid;place-items:center;flex:none}
.addc .plus svg{width:12px;height:12px}
.ingrp{margin-bottom:10px}
.ingrp .cell{--inset:16px}
.stepno{width:24px;height:24px;border-radius:50%;background:var(--fill);font-size:13px;font-weight:700;display:grid;place-items:center;flex:none;margin-top:6px}
.err{background:color-mix(in srgb,var(--red) 14%,var(--card));color:var(--red);border-radius:14px;padding:12px 16px;font-weight:600;margin-bottom:16px;font-size:15px}
.danger{color:var(--red);justify-content:center;font-weight:600}
.danger.armed{background:var(--red);color:#fff}
.status{font-size:13px;color:var(--label2);text-align:center;padding:6px 0 12px}

.typechips{display:flex;gap:8px;overflow-x:auto;margin:-10px -20px 22px;padding:2px 20px;scrollbar-width:none}
.typechips::-webkit-scrollbar{display:none}
.typechips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.tchip{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:999px;background:var(--card);font-size:15px;font-weight:500;color:var(--label);border:1px solid var(--sep)}
.tchip svg{width:15px;height:15px}
.tchip .num{color:var(--label2);font-size:13px}
.tchip[aria-pressed="true"]{background:var(--label);color:var(--bg);border-color:var(--label)}
.tchip[aria-pressed="true"] .num{color:inherit;opacity:.7}
.dtypes{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 14px}
.dtypes .tchip{height:28px;font-size:13px;padding:0 11px}
.byline{font-size:13px;color:var(--label2);margin:12px 0 0}
.linkbtn{color:var(--tint);font-size:15px}
.themeseg{display:inline-flex;align-items:center;gap:2px;height:44px;padding:4px;border-radius:999px}
.themeseg button{height:36px;min-width:40px;padding:0 12px;border-radius:999px;display:grid;place-items:center;font-size:15px;font-weight:600;color:var(--label)}
.themeseg button svg{width:19px;height:19px}
.themeseg button[aria-pressed="true"]{background:color-mix(in srgb,var(--label) 16%,transparent)}
.switch{width:51px;height:31px;border-radius:999px;background:var(--fill);position:relative;flex:none;transition:background .2s}
.switch i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .2s}
.switch[aria-checked="true"]{background:#34C759}
.switch[aria-checked="true"] i{transform:translateX(20px)}
.nutline{font-size:14px;min-height:44px}
.nutline.addc{font-size:15px}
.contrib{font-size:14px;font-weight:600;white-space:nowrap}
.nutedit{display:grid;gap:10px;align-items:stretch}
.nuthead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.nfgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.nf{display:grid;gap:3px;font-size:11px;color:var(--label2);text-align:center}
.nf .in{background:var(--fill);border-radius:9px;padding:8px 4px;text-align:center;font-size:16px}
.nf.wide{grid-template-columns:1fr 96px;align-items:center;text-align:left;font-size:14px}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--fill);border-top-color:var(--tint);animation:rot .8s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}

@media (max-width:800px){
  .dhead{grid-template-columns:1fr;gap:18px;margin:0 0 22px}
  .dinfo .tiles{margin-bottom:0}
  .dbody{grid-template-columns:1fr;gap:0}
  .dbody .dcol:first-child{position:static}
  .hero .ph{aspect-ratio:4/3;border-radius:24px}
}
@media (max-width:480px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .nutri{grid-template-columns:1fr;justify-items:start}
  .rings{width:116px;height:116px}
  .nutri .rings{justify-self:center}
  .cats .catb{font-size:11px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Open Food Facts */
.offrow{gap:8px;flex-wrap:wrap;padding-block:10px}
.offbtn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;background:var(--fill);color:var(--tint);font-size:14px;font-weight:600}
.offbtn svg{width:16px;height:16px}
.offname{display:block;font-size:12px;color:var(--tint);margin-top:2px}
.offsearch{display:flex;gap:8px;align-items:center;margin-bottom:16px}
.offsearch .gbtn{flex:none;padding:0 16px}
.offres{align-items:flex-start;gap:14px;padding-block:12px}
.offres img,.offres .offph{width:54px;height:54px;border-radius:12px;object-fit:cover;background:#fff;flex:none}
.offres .offph{display:grid;place-items:center;background:var(--fill);color:var(--label3)}
.offres .offph svg{width:28px;height:28px}
.offres .t{font-weight:600;display:block}
.offres .sub{display:block;font-size:13px}
.scanbox{position:relative;border-radius:var(--rl);overflow:hidden;background:#000;aspect-ratio:4/3}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanframe{position:absolute;left:12%;right:12%;top:32%;bottom:32%;border:3px solid rgba(255,255,255,.9);border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
@media (min-width:701px){ .offsheet{top:8vh;bottom:8vh;width:min(560px,calc(100% - 32px))} }

/* samostatná aplikácia */
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{min-height:100vh}
[hidden]{display:none!important}
img{max-width:100%}
.gbtn.save{background:var(--tint);color:#fff}
.syncline{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--label2);padding:0 0 12px;text-align:center}
.syncline.warn{color:var(--label);background:color-mix(in srgb,#FF9500 16%,var(--card));border-radius:14px;padding:10px 14px;margin-bottom:16px;font-size:14px}
.gate{max-width:440px;margin:0 auto;min-height:82vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding-block:40px}
.gate h1{font-size:34px;font-weight:700;letter-spacing:-.025em}
.gate p{color:var(--label2);margin:0}
.gate code{font-size:14px;background:var(--fill);padding:1px 6px;border-radius:6px}
.gate-logo{width:96px;height:96px;border-radius:22px;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.gate-logo svg{width:50px;height:50px}
.gate-btn{height:50px;padding:0 22px;font-size:17px;margin-top:8px}
.gate-btn svg{width:20px;height:20px}
.gate-box{background:var(--card);border-radius:var(--rl);padding:16px 18px;display:grid;gap:8px;text-align:left;width:100%}
.gate-box p{font-size:15px}
.gate-box .gbtn{justify-self:start}

<script>
/* ===================== NASTAVENIA (vyplň v súbore config.js) =====================

const CONFIG = Object.assign({

  FOLDER_NAME: 'Fit Kuchárka',

/* ====================================================== */
const I = {

  flame:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-3 2-4 2-6 1.5 1 2 2 2 3 0-3 1-5 1-7z"/></svg>',

  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 9 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.5L7 7l-5.5 5.5"/></svg>',
  tag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 12V4h8l10 10-7 7z"/><circle cx="7.5" cy="8.5" r="1.5"/></svg>',
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
  auto:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg>',
  cloud:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 18h10.5a4 4 0 0 0 .4-8 6 6 0 0 0-11.6 1.5A3.3 3.3 0 0 0 7 18z"/></svg>',
  google:'<svg viewBox="0 0 24 24"><path fill="#fff" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z"/><path fill="#fff" opacity=".85" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z"/><path fill="#fff" opacity=".7" d="M6.4 14a6 6 0 0 1 0-3.9V7.5H3.1a10 10 0 0 0 0 9z"/><path fill="#fff" opacity=".85" d="M12 6c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.5l3.3 2.6C7.2 7.8 9.4 6 12 6z"/></svg>',
  barcode:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 8v8M10.5 8v8M14 8v8M17 8v8"/></svg>',
  camera:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
};
const CATS = [
  {id:'ranajky',  name:'Raňajky',  hint:'Štart dňa'},
  {id:'desiata',  name:'Desiata',  hint:'Dopoludnia'},
  {id:'obed',     name:'Obed',     hint:'Hlavné jedlo'},
  {id:'olovrant', name:'Olovrant', hint:'Popoludní'},
  {id:'vecera',   name:'Večera',   hint:'Na záver dňa'},
];
const SWEET = 'Sladké / Koláče';
const TYPES = ['Mäsité','Ryby','Bezmäsité','Vegánske','Vajíčka','Cestoviny','Ryža a obilniny','Šaláty','Polievky','Bowl','Wrap a sendvič',SWEET,'Meal prep'];
const TYPE_COL = ['#FF3B30','#30B0C7','#34C759','#00C7BE','#FFB300','#FF9500','#A2845E','#64C466','#FF6B4A','#5AC8FA','#5856D6','#FF2D55','#8E8E93'];
const tcol = t => TYPE_COL[Math.max(0,TYPES.indexOf(t)) % TYPE_COL.length];
const LEGACY_TYPES = {'Sladké':SWEET, 'Pečené':null};
const FAST = 'Do 15 minút';
const rcats = r => Array.isArray(r.categories) ? CATS.map(c=>c.id).filter(id=>r.categories.includes(id)) : (r.category ? [r.category] : []);
const rtypes = r => Array.isArray(r.types) ? [...new Set(r.types.map(t=> t in LEGACY_TYPES ? LEGACY_TYPES[t] : t).filter(Boolean))] : [];
const UNITS = ['g','ml','ks'];
const MEASURES = ['', 'PL (polievková lyžica)','ČL (čajová lyžička)','odmerka','hrnček','šálka','hrsť','štipka','plátok','kus','strúčik','balenie','konzerva'];
const DIFF = ['Ľahké','Stredné','Náročné'];

const S = { off:null, scanStream:null, scanTimer:null, scanReader:null, screen:'app', store:null, purged:{}, img:{}, sync:'', syncMsg:'', me:'', dirty:false, loaded:false, found:null, authErr:'', importMsg:'', token:null, recipes:[], view:'home', id:null, cat:'all', q:'', servings:null, checked:new Set(), draft:null, db:null, assets:null, status:'Načítavam recepty…', err:'', tpage:'', all:[], trash:[], uid:null, user:null, names:{}, dl:null, conflict:null, openNut:new Set(), pending:new Set(), ai:null, aiErr:'', type:'', sort:(()=>{ try{ return localStorage.getItem('kucharka-sort')||'new'; }catch(e){ return 'new'; } })() };
const SORTS = {
  new:     {name:'Najnovšie',            fn:(a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||''))},
  old:     {name:'Najstaršie',           fn:(a,b)=>String(a.createdAt||'').localeCompare(String(b.createdAt||''))},
  kcalAsc: {name:'Kalórie: od najnižších', fn:(a,b)=>kc(a)-kc(b)},
  kcalDesc:{name:'Kalórie: od najvyšších', fn:(a,b)=>kc(b)-kc(a)},
  protDesc:{name:'Bielkoviny: najviac',  fn:(a,b)=>n(b.nutrition?.protein)-n(a.nutrition?.protein)},
  protRatio:{name:'Bielkoviny na 100 kcal', fn:(a,b)=>pr(b)-pr(a)},
  name:    {name:'Názov A–Z',            fn:(a,b)=>(a.name||'').localeCompare(b.name||'','sk')},
};
const kc = r => { const u=r.nutrition||{}; return n(u.kcal) || (n(u.protein)*4+n(u.carbs)*4+n(u.fat)*9); };
const pr = r => { const k=kc(r); return k ? n(r.nutrition?.protein)/k*100 : 0; };
const $ = (s,el=document)=>el.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cat = id => CATS.find(c=>c.id===id) || CATS[0];
const cc = id => `--cc:var(--c-${id||'all'})`;
const n = v => { const x = parseFloat(String(v ?? '').replace(',','.')); return isFinite(x) ? x : 0; };
const shown = v => (v===''||v==null) ? '' : String(v).replace('.',',');

function fmt(x){
  if(!x) return '';
  const whole = Math.floor(x), frac = x - whole;
  for(const [v,s] of [[.25,'¼'],[.333,'⅓'],[.5,'½'],[.667,'⅔'],[.75,'¾']]) if(Math.abs(frac-v)<0.04) return (whole||'')+s;
  return (Math.round(x*10)/10).toString().replace('.',',');
}
const fmtAmt = x => x>=20 ? String(Math.round(x)) : fmt(x);
const shortM = m => (m||'').split(' (')[0];
const plural = (k,a,b,c) => k===1?a:(k>=2&&k<=4?b:c);
const totalMin = r => n(r.prepMin)+n(r.cookMin);
/* ---------- fotky (Google Drive + cache v zariadení) ---------- */
const hasPhoto = r => !!(r.photoDrive || r.photoData);
function photoSrc(r){ return r.photoDrive ? (S.img[r.photoDrive] || r.photoData || '') : (r.photoData || ''); }
function photoBox(r, extra=''){
  const src = photoSrc(r), c = rcats(r)[0];
  if(r.photoDrive && !S.img[r.photoDrive]) loadPhoto(r.photoDrive);
  return `<div class="ph" style="${cc(c)}"${r.photoDrive?` data-ph="${esc(r.photoDrive)}"`:''}>${src ? `<img src="${esc(src)}" alt="${esc(r.name)}">` : `<div class="fb">${I[c]||I.obed}</div>`}${extra}</div>`;
}
const idb = (()=>{
  let p; const open = () => p || (p = new Promise((ok,bad)=>{ const q=indexedDB.open('kucharka',1); q.onupgradeneeded=()=>q.result.createObjectStore('photos'); q.onsuccess=()=>ok(q.result); q.onerror=()=>bad(q.error); }));
  return {
    get: async k => { try{ const db=await open(); return await new Promise(ok=>{ const q=db.transaction('photos').objectStore('photos').get(k); q.onsuccess=()=>ok(q.result||null); q.onerror=()=>ok(null); }); }catch(e){ return null; } },
    put: async (k,v) => { try{ const db=await open(); db.transaction('photos','readwrite').objectStore('photos').put(v,k); }catch(e){} },
  };
})();
const photoLoading = new Set(), photoFailed = new Set();
async function loadPhoto(id){
  if(S.img[id] || photoLoading.has(id) || photoFailed.has(id)) return;
  photoLoading.add(id);
  try{
    let blob = await idb.get(id);
    if(!blob){
      if(!tokenOk()) return;
      blob = await (await api(`${DRIVE}/files/${encodeURIComponent(id)}?alt=media`)).blob();
      idb.put(id, blob);
    }
    S.img[id] = URL.createObjectURL(blob);
    document.querySelectorAll('[data-ph]').forEach(el=>{
      if(el.dataset.ph!==id) return;
      const fb = el.querySelector('.fb'); if(!fb) return;
      const img = new Image(); img.src = S.img[id]; img.alt = ''; fb.replaceWith(img);
    });
  }catch(e){ if(e.code!=='auth') photoFailed.add(id); }
  finally{ photoLoading.delete(id); }
}
function dataUrlToBlob(u){ const [h,b]=u.split(','); const bin=atob(b); const a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return new Blob([a],{type:(h.match(/data:([^;]+)/)||[])[1]||'image/jpeg'}); }
async function resizeImage(file, max, q){
  const url = URL.createObjectURL(file);
  const img = await new Promise((ok,bad)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=bad; i.src=url; });
  const k = Math.min(1, max/Math.max(img.width,img.height));
  const c = document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
  return c.toDataURL('image/jpeg', q);
}

/* ---------- prihlásenie Google (OAuth, bez hesiel v kóde) ---------- */
const REDIRECT = location.origin + location.pathname.replace(/index\.html$/,'');
const SCOPE = 'https://www.googleapis.com/auth/drive';
const DRIVE = 'https://www.googleapis.com/drive/v3', UPLOAD = 'https://www.googleapis.com/upload/drive/v3';
const LS = {
  get(k){ try{ return JSON.parse(localStorage.getItem('kucharka-'+k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem('kucharka-'+k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem('kucharka-'+k); }catch(e){} },
};
const configured = () => CONFIG.CLIENT_ID && !CONFIG.CLIENT_ID.startsWith('SEM_');
const tokenOk = () => !!S.token && S.token.exp > Date.now() + 30000;
function signIn(silent, consent){
  if(!configured()) return;
  if(S.draft) stashDraft(true);
  cacheSave();
  const state = Math.random().toString(36).slice(2) + Date.now().toString(36);
  LS.set('oauth-state', state);
  if(silent) LS.set('silent-at', Date.now());
  const p = new URLSearchParams({ client_id:CONFIG.CLIENT_ID, redirect_uri:REDIRECT, response_type:'token', scope:SCOPE, include_granted_scopes:'true', state });
  const hint = LS.get('email'); if(hint) p.set('login_hint', hint);
  if(silent) p.set('prompt','none');
  else if(consent) p.set('prompt','consent');
  location.assign('https://accounts.google.com/o/oauth2/v2/auth?' + p.toString());
}
function handleRedirect(){
  const h = location.hash;
  if(!/access_token=|error=/.test(h)) return;
  const q = new URLSearchParams(h.slice(1));
  history.replaceState(null, '', location.pathname + location.search);
  if(q.get('state') !== LS.get('oauth-state')) return;
  LS.del('oauth-state');
  if(q.get('error')){ S.authErr = q.get('error'); return; }
  LS.set('token', { access:q.get('access_token'), exp: Date.now() + (Number(q.get('expires_in'))||3600)*1000 });
  LS.del('silent-at');
}
const canSilent = () => !!LS.get('email') && Date.now() - (LS.get('silent-at')||0) > 120000;
async function signOut(){
  const t = S.token;
  ['token','cache','email','me','store'].forEach(k=>LS.del(k));
  if(t){ try{ await fetch('https://oauth2.googleapis.com/revoke?token='+encodeURIComponent(t.access), {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}}); }catch(e){} }
  location.replace(REDIRECT);
}
async function api(url, opt={}){
  if(!tokenOk()) throw {code:'auth'};
  let res;
  try{ res = await fetch(url, {...opt, headers:{...(opt.headers||{}), Authorization:'Bearer '+S.token.access}}); }
  catch(e){ throw {code:'offline'}; }
  if(res.status===401){ S.token=null; LS.del('token'); throw {code:'auth'}; }
  if(!res.ok){ let m=''; try{ m=(await res.json()).error?.message||''; }catch(e){} throw {code:'http', status:res.status, message:m}; }
  return res;
}

/* ---------- úložisko: jeden JSON súbor v priečinku na Google Drive ---------- */
const q1 = s => String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
async function findFile(folderId){
  const q = `'${q1(folderId)}' in parents and name='${q1(CONFIG.FILE_NAME)}' and trashed=false`;
  const r = await (await api(`${DRIVE}/files?q=${encodeURIComponent(q)}&fields=files(id,version)&pageSize=5`)).json();
  return (r.files||[])[0] || null;
}
async function findStore(){
  const q = `name='${q1(CONFIG.FOLDER_NAME)}' and mimeType='application/vnd.google-apps.folder' and trashed=false`;
  const r = await (await api(`${DRIVE}/files?q=${encodeURIComponent(q)}&fields=files(id,name,ownedByMe,owners(displayName))&pageSize=20`)).json();
  const folders = r.files || [];
  for(const f of folders){ const file = await findFile(f.id); if(file) return {folder:f, file}; }
  return folders.length ? {folder:folders[0], file:null} : null;
}
async function uploadNew(parent, name, mime, blob){
  const fd = new FormData();
  fd.append('metadata', new Blob([JSON.stringify({name, parents:[parent], mimeType:mime})], {type:'application/json'}));
  fd.append('file', blob);
  return (await api(`${UPLOAD}/files?uploadType=multipart&fields=id,version`, {method:'POST', body:fd})).json();
}
const payload = () => JSON.stringify({ app:'Fit Kuchárka', v:1, savedAt:new Date().toISOString(), recipes:S.all.map(r=>{ const {photoData, ...x} = r; return r.photoDrive ? x : r; }), purged:S.purged });
async function createStore(){
  let folder = S.found?.folder;
  if(!folder) folder = await (await api(`${DRIVE}/files?fields=id,name`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:CONFIG.FOLDER_NAME, mimeType:'application/vnd.google-apps.folder'})})).json();
  const file = await uploadNew(folder.id, CONFIG.FILE_NAME, 'application/json', new Blob([payload()], {type:'application/json'}));
  S.store = {folderId:folder.id, fileId:file.id, version:file.version, folderName:folder.name};
  S.dirty = false; cacheSave();
}
const stamp = r => String(r.changedAt || r.updatedAt || r.createdAt || '');
function mergeIn(data){
  const purged = {...(data.purged||{}), ...S.purged};
  const map = new Map(S.all.map(r=>[r.id, r]));
  for(const r of (data.recipes||[])){
    if(!r || !r.id) continue;
    const cur = map.get(r.id);
    if(!cur || stamp(r) > stamp(cur)) map.set(r.id, (cur && cur.photoData && !r.photoDrive && !r.photoData) ? {...r, photoData:cur.photoData} : r);
  }
  for(const id in purged) map.delete(id);
  S.all = [...map.values()]; S.purged = purged; splitAll();
}
async function pull(force){
  const meta = await (await api(`${DRIVE}/files/${encodeURIComponent(S.store.fileId)}?fields=id,version,trashed`)).json();
  if(meta.trashed) throw {code:'http', status:404, message:'Súbor s receptami je v koši na Google Drive.'};
  if(!force && meta.version === S.store.version) return false;
  const data = await (await api(`${DRIVE}/files/${encodeURIComponent(S.store.fileId)}?alt=media`)).json();
  mergeIn(data); S.store.version = meta.version; cacheSave();
  return true;
}
async function uploadPendingPhotos(){
  for(const r of S.all){
    if(!r.photoData || r.photoDrive) continue;
    const blob = dataUrlToBlob(r.photoData);
    const f = await uploadNew(S.store.folderId, `foto-${r.id}-${Date.now().toString(36)}.jpg`, 'image/jpeg', blob);
    r.photoDrive = f.id; delete r.photoData;
    idb.put(f.id, blob); S.img[f.id] = URL.createObjectURL(blob);
    cacheSave();
  }
}
let pushing = null, pushAgain = false;
async function push(){
  if(!S.store?.fileId) return;
  if(pushing){ pushAgain = true; return pushing; }
  pushing = (async()=>{
    do{
      pushAgain = false;
      setSync('saving');
      try{
        await uploadPendingPhotos();
        if(await pull(false)) render();
        const res = await (await api(`${UPLOAD}/files/${encodeURIComponent(S.store.fileId)}?uploadType=media&fields=id,version`, {method:'PATCH', headers:{'Content-Type':'application/json'}, body:payload()})).json();
        S.store.version = res.version; S.dirty = false; cacheSave(); setSync('ok');
      }catch(e){ handleErr(e); return; }
    }while(pushAgain);
  })();
  try{ await pushing; } finally{ pushing = null; }
}
function commit(){ S.dirty = true; splitAll(); cacheSave(); render(); push(); }
function cacheSave(){ LS.set('cache', {store:S.store, all:S.all, purged:S.purged, dirty:S.dirty}); }

/* stav synchronizácie */
function setSync(state, msg=''){ S.sync = state; S.syncMsg = msg; const el = $('#syncline'); if(el) el.outerHTML = syncLine(); }
function syncLine(){
  const map = {
    saving: ['', 'Ukladám na Google Drive…'],
    offline: ['warn', 'Si offline. Zmeny sú uložené v zariadení a nahrajú sa, keď budeš online.'],
    auth: ['warn', 'Prihlásenie vypršalo. Zmeny sú uložené v zariadení.'],
    error: ['warn', 'Google Drive: ' + (S.syncMsg || 'nepodarilo sa uložiť.')],
    scope: ['warn', 'Pri prihlásení nebol povolený prístup ku Google Drive. Prihlás sa znova a na obrazovke Googlu zaškrtni prístup k Disku.'],
  };
  const m = map[S.sync];
  if(!m) return '<div id="syncline" hidden></div>';
  const btn = S.sync==='scope' ? '<button class="linkbtn" data-act="consent">Prihlásiť a povoliť</button>' : S.sync==='auth' ? '<button class="linkbtn" data-act="signin">Prihlásiť znova</button>' : S.sync==='error' ? '<button class="linkbtn" data-act="sync">Skúsiť znova</button>' : '';
  return `<div id="syncline" class="syncline ${m[0]}">${S.sync==='saving'?'<span class="spin"></span>':''}<span>${esc(m[1])}</span>${btn}</div>`;
}
function handleErr(e){
  if(e && e.code==='auth'){
    setSync('auth');
    if(!S.draft && canSilent()) signIn(true);
    return;
  }
  if(e && e.code==='offline'){ setSync('offline'); return; }
  if(e && e.status===404 && S.store){ S.store = null; cacheSave(); connect(); return; }
  if(e && e.status===403){
    const m = (e.message||'').toLowerCase();
    if(m.includes('has not been used') || m.includes('disabled') || m.includes('accessnotconfigured')){ setSync('error', 'v Google Cloud projekte nie je zapnuté Google Drive API'); return; }
    if(m.includes('insufficient') || m.includes('scope') || m.includes('permission_denied') && !S.store){ setSync('scope'); return; }
    setSync('error', S.store?.shared ? 'nemáš oprávnenie upravovať zdieľaný priečinok (požiadaj o prístup „Editor“)' : (e.message || 'Google zamietol prístup'));
    return;
  }
  setSync('error', e && e.message ? e.message : '');
}
async function connect(){
  try{
    if(!S.me){
      const a = await (await api(`${DRIVE}/about?fields=user(displayName,emailAddress)`)).json();
      S.me = a.user.displayName || a.user.emailAddress; LS.set('me', S.me); LS.set('email', a.user.emailAddress);
    }
    if(!S.store?.fileId){
      S.status = 'Hľadám kuchárku na Google Drive…'; render();
      const f = await findStore();
      if(!f || !f.file){ S.found = f; S.screen = 'nofolder'; S.status=''; render(); return; }
      S.store = {folderId:f.folder.id, fileId:f.file.id, version:null, folderName:f.folder.name, shared: !f.folder.ownedByMe};
      S.screen = 'app';
    }
    const changed = await pull(!S.store.version);
    S.status = '';
    if(changed || !S.loaded) render();
    S.loaded = true;
    if(S.dirty) push(); else setSync('ok');
  }catch(e){ S.status=''; render(); handleErr(e); }
}
async function refresh(){
  if(!S.store?.fileId || !tokenOk() || pushing || document.visibilityState!=='visible') return;
  try{ if(await pull(false)) render(); if(S.dirty) push(); else if(S.sync!=='ok') setSync('ok'); }catch(e){ handleErr(e); }
}

async function boot(){
  handleRedirect();
  S.token = LS.get('token');
  if(S.token && !(S.token.exp > Date.now())) S.token = null;
  S.me = LS.get('me') || '';
  const c = LS.get('cache');
  if(c){ S.store = c.store || null; S.all = c.all || []; S.purged = c.purged || {}; S.dirty = !!c.dirty; S.loaded = true; splitAll(); }
  if(!configured()){ S.screen = 'setup'; render(); return; }
  if(!tokenOk()){
    if(c && !S.authErr && canSilent()){ render(); return signIn(true); }
    S.screen = c && S.store ? 'app' : 'login';
    S.status = '';
    render();
    if(S.screen==='app') setSync('auth');
    return;
  }
  S.screen = (S.store && S.store.fileId) ? 'app' : 'app';
  if(!c) S.status = 'Načítavam recepty…';
  render();
  await connect();
  setInterval(refresh, 20000);
  document.addEventListener('visibilitychange', refresh);
  window.addEventListener('online', ()=>{ if(S.dirty) push(); else refresh(); });
}
function splitAll(){ S.recipes = S.all.filter(r=>!r.deletedAt); S.trash = S.all.filter(r=>r.deletedAt).sort((a,b)=>String(b.deletedAt).localeCompare(String(a.deletedAt))); }
const who = id => (id && !/^u_[A-Za-z0-9_-]{16,}$/.test(id)) ? id : '';
const dshort = iso => iso ? new Date(iso).toLocaleDateString('sk-SK',{day:'numeric',month:'numeric',year:'numeric'}) : '';
function byline(r){
  const a=who(r.createdBy), u=who(r.updatedBy), parts=[];
  if(r.createdAt) parts.push(a ? `Pridal(a) ${a} ${dshort(r.createdAt)}` : `Pridané ${dshort(r.createdAt)}`);
  if(r.updatedAt && r.updatedAt!==r.createdAt) parts.push(u ? `naposledy upravil(a) ${u} ${dshort(r.updatedAt)}` : `upravené ${dshort(r.updatedAt)}`);
  return parts.join(' · ');
}
async function saveRecipe(r){
  const {id, _base, _snap, ...data} = r;
  const now = new Date().toISOString();
  if(S.me){ data.updatedBy = S.me; if(!data.createdBy) data.createdBy = S.me; }
  delete data.deletedAt; delete data.deletedBy;
  data.changedAt = now;
  const i = S.all.findIndex(x=>x.id===id);
  if(i>=0) S.all[i] = {id, ...data}; else S.all.push({id, ...data});
  commit();
}
async function trashRecipe(r){ Object.assign(S.all.find(x=>x.id===r.id), {deletedAt:new Date().toISOString(), deletedBy:S.me||'', changedAt:new Date().toISOString()}); commit(); }
async function restoreRecipe(r){ Object.assign(S.all.find(x=>x.id===r.id), {deletedAt:'', deletedBy:'', changedAt:new Date().toISOString()}); commit(); }
async function purgeRecipe(r){
  S.all = S.all.filter(x=>x.id!==r.id); S.purged[r.id] = new Date().toISOString(); commit();
  if(r.photoDrive){ try{ await api(`${DRIVE}/files/${encodeURIComponent(r.photoDrive)}`, {method:'DELETE'}); }catch(e){} }
}
function backup(){
  const data = JSON.stringify({app:'Fit Kuchárka', exportedAt:new Date().toISOString(), recipes:S.all, purged:S.purged}, null, 2);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], {type:'application/json'}));
  a.download = `kucharka-zaloha-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
async function importBackup(file){
  try{
    const data = JSON.parse(await file.text());
    const list = Array.isArray(data) ? data : (data.recipes || []);
    const photos = data.photos || {};
    let added = 0, updated = 0;
    const now = new Date().toISOString();
    for(const raw of list){
      if(!raw || !raw.id || !raw.name) continue;
      const r = {...raw};
      if(r.photoId){ if(photos[r.photoId]) r.photoData = photos[r.photoId]; delete r.photoId; }
      const i = S.all.findIndex(x=>x.id===r.id);
      if(i<0){ r.changedAt = now; S.all.push(r); added++; }
      else if(stamp(r) > stamp(S.all[i])){ S.all[i] = r; updated++; }
    }
    commit();
    S.importMsg = `Nahrané: ${added} nových${updated?`, ${updated} aktualizovaných`:''} receptov.`;
  }catch(e){ S.importMsg = 'Súbor sa nepodarilo načítať. Vyber zálohu vo formáte JSON z Fit Kuchárky.'; }
  render();
}
/* rozpísaný recept v tomto zariadení (poistka pri zatvorení okna) */
const DRAFT_KEY='kucharka-draft';
let draftTimer=null;
function stashDraft(now){ clearTimeout(draftTimer); const f=()=>{ try{ if(S.draft) localStorage.setItem(DRAFT_KEY, JSON.stringify(S.draft)); }catch(e){} }; if(now) f(); else draftTimer=setTimeout(f, 400); }
function clearStash(){ clearTimeout(draftTimer); try{ localStorage.removeItem(DRAFT_KEY); }catch(e){} }
function readStash(){ try{ const v=localStorage.getItem(DRAFT_KEY); return v?JSON.parse(v):null; }catch(e){ return null; } }
const isDirty = d => d && d._snap !== JSON.stringify({...d, _snap:undefined, _base:undefined});

/* ---------- main views ---------- */
function go(view, id=null){ S.view=view; S.id = view==='detail' ? id : null; if(view==='types') S.tpage = id||''; S.servings=null; S.checked=new Set(); render(); window.scrollTo({top:0}); }

function render(){
  if(S.screen && S.screen!=='app'){ $('#app').innerHTML = viewGate(); const tb=$('#tabbar'); if(tb) tb.hidden=true; return; }
  const r = S.id ? S.recipes.find(x=>x.id===S.id) : null;
  const detail = S.view==='detail' && r, trash = S.view==='trash', types = S.view==='types';
  const title = detail ? r.name : trash ? 'Kôš' : types ? (S.tpage || 'Druhy jedál') : (S.cat==='all' ? 'Kuchárka' : cat(S.cat).name);
  const bar = `<div class="topbar" id="topbar">
    <div class="l">${types && S.tpage ? `<button class="gbtn glass" data-go="types" aria-label="Späť">${I.back}<span>Druhy</span></button>` : detail && S.back==='types' ? `<button class="gbtn glass" data-tpage="${esc(S.backT||'')}" aria-label="Späť">${I.back}<span>${esc(S.backT||'Druhy')}</span></button>` : detail||trash ? `<button class="gbtn glass" data-go="home" aria-label="Späť">${I.back}<span>Recepty</span></button>` : themeBtn()}</div>
    <div class="mid">${esc(title)}</div>
    <div class="r">${trash ? '' : detail ? `<button class="gbtn glass tint" data-act="edit">Upraviť</button>` : `<button class="gbtn glass round tint" data-act="new" aria-label="Nový recept">${I.plus}</button>`}</div>
  </div>`;
  $('#app').innerHTML = bar + syncLine() + (S.status?`<div class="status">${esc(S.status)}</div>`:'') + (detail ? viewDetail(r) : trash ? viewTrash() : types ? viewTypes() : viewHome());
  renderTabbar(detail||trash ? null : types ? 'types' : S.cat);
  onScroll();
}
function renderTabbar(active){
  let tb = $('#tabbar');
  if(!tb){ tb = document.createElement('nav'); tb.id='tabbar'; tb.className='tabbar glass'; tb.setAttribute('aria-label','Kapitoly'); document.body.appendChild(tb); }
  tb.hidden = !!S.draft;
  tb.innerHTML = [{id:'all',name:'Všetko'},...CATS].map(c=>`<button class="tab" data-cat="${c.id}" style="${cc(c.id)}" aria-pressed="${active===c.id}">${I[c.id]}<span>${c.name}</span></button>`).join('')
    + `<button class="tab" data-go="types" style="--cc:var(--tint)" aria-pressed="${active==='types'}">${I.tag}<span>Druhy</span></button>`;
}

function viewHome(){
  const q = S.q.trim().toLowerCase();
  const match = r => (!q || (r.name+' '+rtypes(r).join(' ')+' '+(r.ingredients||[]).map(i=>i.name).join(' ')).toLowerCase().includes(q))
    && (!S.type || (S.type===FAST ? (totalMin(r)>0 && totalMin(r)<=15) : rtypes(r).includes(S.type)));
  const today = new Date().toLocaleDateString('sk-SK',{weekday:'long', day:'numeric', month:'long'});
  let out = `<header class="large"><div class="date">${esc(today)}</div><h1>${S.cat==='all'?'Kuchárka':cat(S.cat).name}</h1></header>
    <label class="searchf">${I.search}<input id="search" type="search" placeholder="Recept alebo surovina" value="${esc(S.q)}" autocomplete="off"></label>`;

  const st = !S.draft && readStash();
  if(st && (String(st.name||'').trim() || (st.ingredients||[]).some(i=>String(i.name||'').trim()))) out += `<div class="block"><div class="group">
      <div class="cell"><span class="grow">Máš rozpísaný neuložený recept${st.name?` <b>${esc(st.name)}</b>`:''}.</span></div>
      <button class="cell addc" data-act="resume"><span class="grow">Pokračovať v úprave</span>${I.chev}</button>
      <button class="cell danger" data-act="dropstash" style="justify-content:flex-start;font-weight:500">Zahodiť</button></div></div>`;
  const foot = () => `<div class="block" style="margin-top:12px"><div class="gtitle">Údaje</div><div class="group">
      <div class="cell"><span class="ico" style="--cc:#34A853">${I.cloud}</span><span class="grow">Google Drive<span class="sub" style="display:block;font-size:13px">priečinok ${esc(S.store?.folderName||CONFIG.FOLDER_NAME)}${S.store?.shared?' (zdieľaný)':''} · ${S.sync==='ok'?'všetko uložené':S.sync==='saving'?'ukladám…':'čaká na uloženie'}</span></span><button class="linkbtn" data-act="sync">Synchronizovať</button></div>
      <button class="cell" data-go="trash"><span class="grow">Kôš</span><span class="sub num">${S.trash.length}</span>${I.chev}</button>
      <button class="cell" data-act="backup"><span class="grow">Stiahnuť zálohu receptov</span><span class="sub">JSON</span></button>
      <label class="cell" for="f-import" style="cursor:pointer"><span class="grow">Nahrať recepty zo zálohy</span><span class="sub">JSON</span></label>
      <button class="cell" data-act="signout"><span class="grow">Odhlásiť sa${S.me?` <span class="sub">(${esc(S.me)})</span>`:''}</span></button>
    </div>${S.importMsg?`<p class="gfoot" style="color:var(--label)">${esc(S.importMsg)}</p>`:''}<p class="gfoot">Recepty sa po každej zmene uložia do súboru ${esc(CONFIG.FILE_NAME)} na Google Drive. Vymazané recepty sa najprv presunú do koša. Údaje o výrobkoch: Open Food Facts (ODbL).</p>
    <input id="f-import" type="file" accept="application/json,.json" hidden></div>`;
  if(!S.recipes.length){
    return out + `<div class="empty"><h3>${S.status?'Načítavam…':'Zatiaľ žiadne recepty'}</h3><p>Ťukni na <b>+</b> vpravo hore a pridaj prvý recept, alebo nahraj recepty zo zálohy nižšie.</p></div>` + (S.status?'':foot());
  }
  const list = S.recipes.filter(match).sort((a,b)=> SORTS[S.sort].fn(a,b) || (a.name||'').localeCompare(b.name||'','sk'));
  out += `<div class="sortbar"><span class="lbl">Zoradiť</span>${sortPill()}</div>`;
  const used = TYPES.filter(t=>S.recipes.some(r=>rtypes(r).includes(t)));
  const hasFast = S.recipes.some(r=>totalMin(r)>0 && totalMin(r)<=15);
  const chipList = [...used, ...(hasFast?[FAST]:[])];
  if(chipList.length || S.type) out += `<div class="typechips" role="group" aria-label="Druh jedla">
    <button class="tchip" data-type="" aria-pressed="${!S.type}">Všetky druhy</button>
    ${[...new Set([...chipList, ...(S.type?[S.type]:[])])].map(t=>`<button class="tchip" data-type="${esc(t)}" aria-pressed="${S.type===t}">${t===FAST?I.clock:''}${esc(t)} <span class="num">${t===FAST?S.recipes.filter(r=>totalMin(r)>0&&totalMin(r)<=15).length:S.recipes.filter(r=>rtypes(r).includes(t)).length}</span></button>`).join('')}
  </div>`;

  if(S.cat==='all' && !q && !S.type){
    out += `<div class="block"><div class="gtitle">Obsah</div><div class="group" style="--inset:58px">
      ${CATS.map(c=>{ const k=list.filter(r=>rcats(r).includes(c.id)).length;
        return `<button class="cell" data-cat="${c.id}" style="${cc(c.id)}"><span class="ico">${I[c.id]}</span><span class="grow">${c.name}</span><span class="sub num">${k}</span>${I.chev}</button>`; }).join('')}
    </div></div>`;
    for(const c of CATS){
      const items = list.filter(r=>rcats(r).includes(c.id)); if(!items.length) continue;
      out += `<section class="block" style="${cc(c.id)}"><div class="sechead"><h2>${c.name}</h2><button data-cat="${c.id}">Všetky</button></div>
        ${rows(items, c.id)}</section>`;
    }
    const anytime = list.filter(r=>!rcats(r).length);
    if(anytime.length) out += `<section class="block"><div class="sechead"><h2>Kedykoľvek</h2></div>${rows(anytime, null)}</section>`;
    return out + foot();
  }
  const items = list.filter(r=> S.cat==='all' || rcats(r).includes(S.cat));
  if(!items.length) return out + `<div class="empty"><h3>${q||S.type?'Nič sa nenašlo':'Táto kapitola je prázdna'}</h3><p>${q||S.type?'Skús iný výraz alebo iný druh jedla.':'Pridaj recept cez + vpravo hore.'}</p></div>`;
  return out + rows(items, S.cat!=='all'?S.cat:null) + foot();
}
function rows(items, catId){ return `<div class="group rows">${items.map((r,ix)=>row(r,ix,catId)).join('')}</div>`; }
function row(r, ix, catId){
  const nu=r.nutrition||{}, k=Math.round(kc(r)), P=n(nu.protein);
  const hl = key => (S.sort.startsWith(key)) ? ' class="hl"' : '';
  const date = r.createdAt ? new Date(r.createdAt).toLocaleDateString('sk-SK',{day:'numeric',month:'numeric',year:'numeric'}) : '';
  const extra = (S.sort==='new'||S.sort==='old') && date ? `<span class="hl">pridané ${date}</span>`
              : S.sort==='protRatio' && k ? `<span class="hl"><b>${fmt(P/k*100)}</b> g B / 100 kcal</span>` : '';
  const others = rcats(r).filter(id=>id!==catId);
  const also = catId && others.length ? `<span>aj ${others.map(id=>cat(id).name.toLowerCase()).join(', ')}</span>` : (!catId ? `<span>${rcats(r).length ? rcats(r).map(id=>cat(id).name).join(', ') : 'kedykoľvek'}</span>` : '');
  return `<button class="cell rrow" data-open="${esc(r.id)}" style="${cc(catId||rcats(r)[0])}">
    <span class="no num">${ix+1}</span>

function lookupLocal(name){
  const s=' '+norm(name); const hit=FOODIDX.find(f=>s.includes(' '+f.k)); if(!hit) return null;
  const [kcal,p,c,f,fib,opt={}] = hit.v; return {nut:{kcal,p,c,f,fib}, pieceG:opt.piece||'', dens:opt.dens||''};
}
const r1 = x => Math.round(x*10)/10;
const fmtN = x => String(r1(n(x))).replace('.',',');

function computeTotals(d){
  const sv=Math.max(1,n(d.servings)||1), t={kcal:0,p:0,c:0,f:0,fib:0}; let missing=0;
  for(const i of d.ingredients){
    if(!String(i.name).trim()) continue;
    const c=contrib(i);
    if(!c || (i.unit==='ks' && !n(i.pieceG))){ if(n(i.amount) || !c) missing++; continue; }
    for(const k in t) t[k]+=c[k];

function refreshNut(ix){ const d=S.draft, el=$('#nut-'+ix); if(d && el && d.ingredients[ix]) el.outerHTML = nutCell(d.ingredients[ix], ix); }

function autoLookup(ix){

  const h=lookupLocal(i.name);
  if(h){ applyHit(i,h); refreshNut(ix); recalc(); return; }

let aiTimer=null; const aiQueue=new Set();
function queueAI(i){ if(!S.ai) return; aiQueue.add(i); clearTimeout(aiTimer); aiTimer=setTimeout(()=>{ const list=[...aiQueue]; aiQueue.clear(); aiLookup(list); }, 600); }
async function aiLookup(list){
  const d=S.draft; if(!d) return;
  const items=list.filter(i=>d.ingredients.includes(i) && String(i.name).trim()); if(!items.length) return;
  if(!S.ai){ refreshAllNut(); updateAutoNote(); return; }
  items.forEach(i=>S.pending.add(i)); refreshAllNut(); updateAutoNote();
  const prompt = `Si nutričný asistent. Pre každú surovinu (názvy sú po slovensky) odhadni výživové hodnoty na 100 g tak, ako sú uvedené na slovenských a EÚ etiketách: energia v kcal (kcal), bielkoviny (p), využiteľné sacharidy bez vlákniny (c), tuky (f), vláknina (fib) — všetko v gramoch. Suché prílohy (ryža, cestoviny, vločky, strukoviny) ber v surovom/suchom stave, ak názov nehovorí inak. Pridaj typickú hmotnosť 1 kusu v gramoch (pieceG, inak null) a hustotu v g/ml pre tekutiny (dens, inak null).
Odpovedz iba JSON poľom v tvare [{"id":0,"kcal":0,"p":0,"c":0,"f":0,"fib":0,"pieceG":null,"dens":null}], jeden objekt na surovinu, id podľa zoznamu.
Suroviny:
${items.map((i,k)=>`${k}: ${String(i.name).trim()} (jednotka v recepte: ${i.unit||'g'})`).join('\n')}`;
  try{
    const res = await S.ai.json(prompt, {modelTier:'quick'});
    const arr = Array.isArray(res) ? res : (res && (res.items||res.suroviny)) || [];
    items.forEach((i,k)=>{
      const o = arr.find(a=>a && +a.id===k) || arr[k]; if(!o) return;
      i.nut={kcal:r1(n(o.kcal)),p:r1(n(o.p)),c:r1(n(o.c)),f:r1(n(o.f)),fib:r1(n(o.fib))};
      if(n(o.pieceG) && !n(i.pieceG)) i.pieceG=r1(n(o.pieceG)); if(n(o.dens) && !n(i.dens)) i.dens=n(o.dens);
      i.src='ai'; i.lookedName=i.name;
    });
    S.aiErr='';
  }catch(e){
    S.aiErr = e && e.code || 'error';
    if(['not_granted','sampling_disabled','capability_disabled','capability_removed','not_declared'].includes(S.aiErr)) S.ai=null;
  }
  items.forEach(i=>S.pending.delete(i));
  if(S.draft!==d) return;
  refreshAllNut(); recalc();
}

/* ---------- Open Food Facts: vyhľadanie výrobku a skenovanie čiarového kódu ---------- */
const OFF = 'https://world.openfoodfacts.org';
const OFF_FIELDS = 'code,product_name,product_name_sk,product_name_cs,product_name_en,generic_name,brands,quantity,serving_quantity,nutriments,image_front_small_url';
function offName(p){ return (p.product_name_sk || p.product_name_cs || p.product_name || p.product_name_en || p.generic_name || '').trim(); }
function offNut(p){
  const m = p.nutriments || {}, g = k => { const v = m[k]; return v===undefined || v==='' ? null : Number(v); };
  let kcal = g('energy-kcal_100g'); if(kcal===null && g('energy_100g')!==null) kcal = g('energy_100g') / 4.184;
  const nut = {kcal, p:g('proteins_100g'), c:g('carbohydrates_100g'), f:g('fat_100g'), fib:g('fiber_100g')};
  if([nut.kcal, nut.p, nut.c, nut.f].every(v=>v===null)) return null;
  for(const k in nut) nut[k] = nut[k]===null ? '' : r1(nut[k]);
  return nut;
}
function offItem(p){ return {code:p.code||'', name:offName(p), brand:(p.brands||'').split(',')[0].trim(), qty:p.quantity||'', serving:Number(p.serving_quantity)||0, img:p.image_front_small_url||'', nut:offNut(p)}; }
async function offFetch(url){
  let res;
  try{ res = await fetch(url); }catch(e){ throw {code:'offline'}; }
  if(res.status===429 || res.status===503) throw {code:'busy'};
  if(!res.ok) throw {code:'http', status:res.status};
  return res.json();
}
async function offSearch(q){
  const u = `${OFF}/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=24&lc=sk&fields=${OFF_FIELDS}`;
  const d = await offFetch(u);
  return (d.products||[]).map(offItem).filter(x=>x.name && x.nut);
}
async function offByCode(code){
  const d = await offFetch(`${OFF}/api/v2/product/${encodeURIComponent(code)}.json?lc=sk&fields=${OFF_FIELDS}`);
  if(!d || d.status===0 || !d.product) return null;
  const it = offItem({...d.product, code: d.product.code || code});
  return it.name || it.nut ? it : null;
}
const offErr = e => e.code==='offline' ? 'Nie si pripojený na internet.' : e.code==='busy' ? 'Open Food Facts je teraz preťažený, skús to o minútu.' : 'Open Food Facts teraz neodpovedá, skús to neskôr.';
function applyOff(ix, it){
  const d = S.draft, i = d && d.ingredients[ix]; if(!i || !it.nut) return;
  i.nut = {...it.nut}; i.src = 'off'; i.offName = [it.brand, it.name].filter(Boolean).join(' · '); i.offCode = it.code;
  if(!String(i.name).trim()) i.name = it.name;
  if(it.serving && !n(i.pieceG)) i.pieceG = it.serving;
  i.lookedName = i.name;
  closeOff(); S.openNut.delete(i); renderSheet(); recalc();
}

async function offRun(){

  catch(e){ o.results = null; o.msg = offErr(e); }
  if(S.off===o){ o.busy = false; renderOff(); }
}
async function offLookupCode(code){
  const o = S.off; if(!o) return;
  code = String(code).replace(/\D/g,''); if(code.length < 6){ o.msg = 'Zadaj celé číslo pod čiarovým kódom.'; renderOff(); return; }
  stopScan(); o.msg = 'Hľadám výrobok ' + code + '…'; renderOff();
  try{
    const it = await offByCode(code);
    if(S.off!==o) return;
    if(!it){ o.msg = `Výrobok s kódom ${code} v Open Food Facts nie je. Skús ho nájsť podľa názvu alebo zadaj hodnoty z obalu ručne.`; o.found = null; }
    else if(!it.nut){ o.msg = `Výrobok „${it.name}“ sa našiel, ale nemá zadané výživové hodnoty. Zadaj ich z obalu ručne.`; o.found = null; }
    else { o.found = it; o.results = [it]; o.msg = ''; }
  }catch(e){ if(S.off===o) o.msg = offErr(e); }
  if(S.off===o) renderOff();
}

/* skener: natívny BarcodeDetector, inak knižnica ZXing (zxing.min.js) */
let zxingLoading = null;
function loadZXing(){ if(window.ZXing) return Promise.resolve(); return zxingLoading || (zxingLoading = new Promise((ok,bad)=>{ const s=document.createElement('script'); s.src='zxing.min.js'; s.onload=ok; s.onerror=()=>{ zxingLoading=null; bad(); }; document.head.appendChild(s); })); }
async function startScan(){
  const o = S.off; if(!o) return;
  if(!navigator.mediaDevices?.getUserMedia){ o.msg = 'Toto zariadenie nepovoľuje kameru v prehliadači. Zadaj číslo kódu ručne.'; renderOff(); return; }
  try{
    S.scanStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720}}, audio:false});
  }catch(e){ o.msg = 'Bez povolenia kamery sa kód nedá naskenovať. Povoľ kameru pre túto stránku alebo zadaj číslo kódu ručne.'; renderOff(); return; }
  if(S.off!==o){ stopScan(); return; }
  renderOff();
  const video = $('#offvideo'); if(!video) return;
  const done = code => { if(S.off===o && !o.found) offLookupCode(code); };
  if('BarcodeDetector' in window){
    try{
      const det = new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});
      const tick = async () => {
        if(!S.scanStream || S.off!==o) return;
        try{ const r = await det.detect(video); if(r.length){ done(r[0].rawValue); return; } }catch(e){}
        S.scanTimer = setTimeout(tick, 250);
      };
      tick(); return;
    }catch(e){ /* nepodporované formáty – použijeme ZXing */ }
  }
  try{ await loadZXing(); }catch(e){ o.msg = 'Čítačku kódov sa nepodarilo načítať. Zadaj číslo kódu ručne.'; renderOff(); return; }
  if(S.off!==o || !S.scanStream) return;
  const hints = new Map(); hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E]);
  const reader = new ZXing.MultiFormatReader(); reader.setHints(hints);
  S.scanReader = reader;
  const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d', {willReadFrequently:true});
  const tick = () => {
    if(!S.scanStream || S.off!==o) return;
    if(video.videoWidth){
      canvas.width = video.videoWidth; canvas.height = video.videoHeight; ctx.drawImage(video, 0, 0);
      try{ const bmp = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(canvas))); const res = reader.decode(bmp); if(res){ done(res.getText()); return; } }catch(e){}
    }
    S.scanTimer = setTimeout(tick, 250);
  };
  tick();
}
function stopScan(){
  clearTimeout(S.scanTimer);
  if(S.scanStream){ S.scanStream.getTracks().forEach(t=>t.stop()); S.scanStream = null; }
  S.scanReader = null;
}
