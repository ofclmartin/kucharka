        <div class="cell"><span class="lbl grow">Varenie</span>${stepper('cookMin',5,'min')}</div>
        <div class="cell"><span class="lbl grow">Porcie</span>${stepper('servings',1,'')}</div>
        <div class="cell"><div class="seg full" role="group" aria-label="Náročnosť">${DIFF.map(x=>`<button type="button" data-diff="${x}" aria-pressed="${d.difficulty===x}">${x}</button>`).join('')}</div></div>
      </div></div>

      <div class="block"><div class="gtitle">Suroviny</div>
        ${d.ingredients.map((i,ix)=>`<div class="group ingrp">
          <div class="cell"><button type="button" class="minus" data-rmi="${ix}" aria-label="Odstrániť surovinu">${I.minus}</button><input class="in" id="i-name-${ix}" data-i="${ix}" data-k="name" value="${esc(i.name)}" placeholder="Surovina, napr. ovsené vločky" autocomplete="off"></div>
          <div class="cell"><span class="lbl grow sub">Množstvo</span><input class="in right num" style="width:64px;flex:none" id="i-amt-${ix}" data-i="${ix}" data-k="amount" inputmode="decimal" value="${esc(shown(i.amount))}" placeholder="0">
            <div class="seg" role="group" aria-label="Jednotka">${UNITS.map(u=>`<button type="button" data-unit="${ix}" data-v="${u}" aria-pressed="${(i.unit||'g')===u}">${u}</button>`).join('')}</div></div>
          <div class="cell"><span class="lbl grow sub">≈ Kuchynsky</span><input class="in right num" style="width:48px;flex:none" id="i-mq-${ix}" data-i="${ix}" data-k="measureQty" inputmode="decimal" value="${esc(shown(i.measureQty))}" placeholder="0">
            <select class="sel" id="i-m-${ix}" data-i="${ix}" data-k="measure" aria-label="Kuchynská miera">${MEASURES.map(m=>`<option value="${esc(m)}" ${i.measure===m?'selected':''}>${m?shortM(m):'miera'}</option>`).join('')}</select></div>
          ${nutCell(i, ix)}
          <div class="cell offrow"><button type="button" class="offbtn" data-offsearch="${ix}">${I.search}<span>Hľadať výrobok</span></button><button type="button" class="offbtn" data-offscan="${ix}">${I.barcode}<span>Skenovať kód</span></button></div>
        </div>`).join('')}
        <div class="group"><button type="button" class="cell addc" data-act="addi"><span class="plus">${I.plus}</span>Pridať surovinu</button></div>
        <p class="gfoot">Kuchynská miera sa pri zmene porcií prepočíta spolu s gramážou. Pol lyžice zapíš ako 0,5.</p>
      </div>

      <div class="block"><div class="gtitle">Výživa na 1 porciu</div><div class="group">
        <div class="cell"><span class="grow">Počítať automaticky zo surovín</span><button type="button" class="switch" id="autosw" role="switch" aria-checked="${!!d.autoNutri}" data-act="auto" aria-label="Automatický výpočet"><i></i></button></div>
        ${nrow('kcal','Energia','kcal')}${nrow('protein','Bielkoviny','g')}${nrow('carbs','Sacharidy','g')}${nrow('fat','Tuky','g')}${nrow('fiber','Vláknina','g')}${nrow('sugar','z toho cukry','g')}
      </div><p class="gfoot" id="auto-note"></p></div>

      <div class="block"><div class="gtitle">Postup</div><div class="group" style="--inset:52px">
        ${d.steps.map((s,ix)=>`<div class="cell" style="align-items:flex-start"><span class="stepno num">${ix+1}</span><textarea class="in" id="s-${ix}" data-s="${ix}" rows="1" placeholder="Popíš krok ${ix+1}" aria-label="Krok ${ix+1}">${esc(s)}</textarea><button type="button" class="minus" style="margin-top:6px" data-rms="${ix}" aria-label="Odstrániť krok">${I.minus}</button></div>`).join('')}
        <button type="button" class="cell addc" data-act="adds"><span class="plus">${I.plus}</span>Pridať krok</button>
      </div></div>

      <div class="block"><div class="gtitle">Tip</div><div class="group">
        <label class="cell" for="f-tips"><textarea class="in" id="f-tips" data-f="tips" rows="1" placeholder="Napr. dá sa pripraviť deň vopred">${esc(d.tips)}</textarea></label>
      </div></div>

      ${isNew?'':`<div class="block"><div class="group"><button type="button" class="cell danger" data-act="del" id="delbtn">Presunúť do koša</button></div></div>`}
    </div>
  </div>`;
  document.querySelectorAll('#sheet textarea').forEach(grow);
  recalc();
  const nb = $('.sheet-body'); nb.scrollTop = top;
  nb.addEventListener('scroll', ()=> $('#sheethead')?.classList.toggle('scrolled', nb.scrollTop>4), {passive:true});
}
function grow(t){ t.style.height='auto'; t.style.height=t.scrollHeight+'px'; }

/* ---------- events ---------- */
function onScroll(){ const b=$('#topbar'); if(b) b.classList.toggle('scrolled', window.scrollY>40); }
window.addEventListener('scroll', onScroll, {passive:true});

document.addEventListener('click', async e=>{
  const t = e.target.closest('button,[data-act]'); if(!t) return;
  const d = S.draft;
  if(t.dataset.act==='offclose'){ closeOff(); return; }
  if(t.dataset.act==='offrescan'){ S.off.found=null; S.off.msg=''; renderOff(); startScan(); return; }
  if(t.dataset.offpick!==undefined && S.off){ const it = t.dataset.offpick==='found' ? S.off.found : S.off.results[+t.dataset.offpick]; if(it && it.nut) applyOff(S.off.ix, it); return; }
  if(t.dataset.offsearch!==undefined){ openOff('search', +t.dataset.offsearch); return; }
  if(t.dataset.offscan!==undefined){ openOff('scan', +t.dataset.offscan); return; }
  if(t.dataset.go){ go(t.dataset.go); return; }
  if(t.dataset.themeSet){ setTheme(t.dataset.themeSet); return; }
  if(t.dataset.tpage!==undefined){ go('types', t.dataset.tpage); return; }
  if(t.dataset.open){ if(S.view!=='detail'){ S.back = S.view==='types' ? 'types' : 'home'; S.backT = S.tpage; } go('detail', t.dataset.open); return; }
  if(t.dataset.cat){ S.cat=t.dataset.cat; S.q=''; go('home'); return; }
  if(t.dataset.sv){ const r=S.recipes.find(x=>x.id===S.id); const base=n(r.servings)||1; S.servings=Math.max(1,(S.servings??base)+ +t.dataset.sv); render(); return; }
  if(t.dataset.check){ const i=+t.dataset.check; S.checked.has(i)?S.checked.delete(i):S.checked.add(i); t.classList.toggle('done'); t.setAttribute('aria-pressed', S.checked.has(i)); return; }
  if(t.dataset.type!==undefined && !t.dataset.settype){ S.type = (S.type===t.dataset.type && t.dataset.type) ? '' : t.dataset.type; if(t.dataset.gohome) { S.cat='all'; go('home'); } else render(); return; }
  if(t.dataset.restore){ const r=S.trash.find(x=>x.id===t.dataset.restore); t.disabled=true; try{ await restoreRecipe(r); }catch(err){ t.disabled=false; t.textContent='Nepodarilo sa'; } return; }
  if(t.dataset.purge){
    if(!t.classList.contains('armed')){ t.classList.add('armed'); t.textContent='Naozaj natrvalo?'; t.style.fontWeight='700'; setTimeout(()=>{ if(t.isConnected){ t.classList.remove('armed'); t.textContent='Vymazať'; t.style.fontWeight=''; } }, 4000); return; }
    const r=S.trash.find(x=>x.id===t.dataset.purge); try{ await purgeRecipe(r); }catch(err){ t.textContent='Nepodarilo sa'; } return; }
  if(!d && !t.dataset.act) return;
  if(t.dataset.setcat){ const id=t.dataset.setcat; let cs=rcats(d).slice();
    cs = cs.includes(id) ? cs.filter(x=>x!==id) : [...cs, id];
    d.categories=CATS.map(c=>c.id).filter(x=>cs.includes(x)); d.category=d.categories[0]||''; renderSheet(); return; }
  if(t.dataset.settype){ const v=t.dataset.settype, ts=rtypes(d).slice(); d.types = ts.includes(v) ? ts.filter(x=>x!==v) : [...ts, v];
    t.setAttribute('aria-pressed', d.types.includes(v)); return; }
  if(t.dataset.diff){ d.difficulty=t.dataset.diff; t.parentNode.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', b===t)); return; }
  if(t.dataset.unit){ const ix=+t.dataset.unit; d.ingredients[ix].unit=t.dataset.v; t.parentNode.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', b===t)); refreshNut(ix); recalc(); return; }
  if(t.dataset.nut){ const i=d.ingredients[+t.dataset.nut]; S.openNut.has(i)?S.openNut.delete(i):S.openNut.add(i); refreshNut(+t.dataset.nut); if(S.openNut.has(i)) $(`#nut-${t.dataset.nut} input`)?.focus(); return; }
  if(t.dataset.ai){ const i=d.ingredients[+t.dataset.ai]; S.openNut.delete(i); aiLookup([i]); return; }
  if(t.dataset.inc){ const k=t.dataset.inc, min = k==='servings'?1:0; d[k]=Math.max(min, n(d[k]) + n(t.dataset.d)); $('#f-'+k).value=d[k]; if(k==='servings') recalc(); return; }
  if(t.dataset.rmi){ d.ingredients.splice(+t.dataset.rmi,1); if(!d.ingredients.length) d.ingredients.push(blankIng()); renderSheet(); return; }
  if(t.dataset.rms){ d.steps.splice(+t.dataset.rms,1); if(!d.steps.length) d.steps.push(''); renderSheet(); return; }
  switch(t.dataset.act){
    case 'new': openSheet(blank()); break;
    case 'signin': signIn(false); break;
    case 'consent': signIn(false, true); break;
    case 'signout': signOut(); break;
    case 'sync': if(tokenOk()) { S.dirty ? push() : refresh(); } else signIn(false); break;
    case 'retry': S.screen='app'; S.found=null; connect(); break;
    case 'create': t.disabled=true; t.textContent='Vytváram…'; try{ await createStore(); S.screen='app'; render(); setSync('ok'); }catch(e){ t.disabled=false; t.textContent='Skúsiť znova'; handleErr(e); } break;
    case 'theme': setTheme(S.theme==='auto' ? (effectiveDark()?'light':'dark') : S.theme==='dark' ? 'light' : 'dark'); break;
    case 'resume': { const st=readStash(); if(st) openSheet(st); break; }
    case 'dropstash': clearStash(); render(); break;
    case 'backup': backup(); break;
    case 'edit': { const r=S.recipes.find(x=>x.id===S.id); openSheet(JSON.parse(JSON.stringify({...blank(), ...r, categories:rcats(r), types:rtypes(r), _base:r.updatedAt||'', autoNutri: r.autoNutri ?? false, nutrition:{...blank().nutrition, ...(r.nutrition||{})}}))); break; }
    case 'cancel': {
      const cb=$('#cancelbtn');
      if(isDirty(d) && cb && !cb.classList.contains('armed')){ cb.classList.add('armed'); cb.textContent='Zahodiť zmeny?'; cb.style.color='var(--red)'; setTimeout(()=>{ if(cb.isConnected){ cb.classList.remove('armed'); cb.textContent='Zrušiť'; cb.style.color=''; } }, 3500); break; }
      closeSheet(); break; }
    case 'force': await save({force:true}); break;
    case 'savecopy': await save({copy:true}); break;
    case 'auto': {
      d.autoNutri=!d.autoNutri;
      if(d.autoNutri){ const miss=[]; d.ingredients.forEach((i,ix)=>{ if(String(i.name).trim() && !hasNut(i)){ const h=lookupLocal(i.name); if(h) applyHit(i,h); else miss.push(i); } }); refreshAllNut(); if(miss.length) aiLookup(miss); }
      recalc(); break; }
    case 'addi': d.ingredients.push(blankIng()); renderSheet(); $(`#i-name-${d.ingredients.length-1}`)?.focus({preventScroll:false}); break;
    case 'adds': d.steps.push(''); renderSheet(); $(`#s-${d.steps.length-1}`)?.focus(); break;
    case 'rmphoto': d.photoDrive=null; d.photoData=null; renderSheet(); break;
    case 'save': await save(); break;
    case 'del': {
      const r=S.recipes.find(x=>x.id===d.id);
      try{ await trashRecipe(r); clearStash(); S.draft=null; document.body.classList.remove('locked'); $('#sheet').innerHTML=''; go('home'); }catch(err){ t.textContent='Vymazanie zlyhalo'; }
      break; }
  }
});
document.addEventListener('input', e=>{
  const t=e.target;
  if(t.id==='search'){ S.q=t.value; const pos=t.selectionStart; render(); const s=$('#search'); s.focus(); s.setSelectionRange(pos,pos); return; }
  const d=S.draft; if(!d) return;
  stashDraft();
  if(t.tagName==='TEXTAREA') grow(t);
  if(t.dataset.f) d[t.dataset.f]=t.value;
  if(t.dataset.i){ const ix=+t.dataset.i; d.ingredients[ix][t.dataset.k]=t.value; if(t.dataset.k==='amount'){ if(!S.openNut.has(d.ingredients[ix])) refreshNut(ix); recalc(); } }
  if(t.dataset.nutI){ const i=d.ingredients[+t.dataset.nutI]; i.nut = {...(i.nut||{}), [t.dataset.nutK]: t.value}; i.src='manual'; recalc(); }
  if(t.dataset.piece){ d.ingredients[+t.dataset.piece].pieceG=t.value; recalc(); }
  if(t.dataset.f==='servings') recalc();
  if(t.dataset.s) d.steps[+t.dataset.s]=t.value;
  if(t.dataset.n){ d.nutrition[t.dataset.n]=t.value; if(d.autoNutri && t.dataset.n!=='sugar') d.autoNutri=false; updateAutoNote(); }
});
document.addEventListener('change', async e=>{
  const t=e.target, d=S.draft;
  if(t.id==='f-import' && t.files[0]){ importBackup(t.files[0]); t.value=''; return; }
  if(t.id==='sort'){ S.sort=t.value; try{ localStorage.setItem('kucharka-sort',S.sort); }catch(err){} render(); return; }
  if(!d) return;
  if(t.dataset.i && t.dataset.k==='name'){ autoLookup(+t.dataset.i); return; }
  if(t.tagName==='SELECT' && t.dataset.i){ d.ingredients[+t.dataset.i][t.dataset.k]=t.value; return; }
  if(t.id==='f-photo' && t.files[0]){
    const st=$('#photo-status'); st.textContent='Spracúvam fotku…';
    try{
      d.photoData = await resizeImage(t.files[0], 1280, .8); d.photoDrive = null;
      renderSheet();
    }catch(err){ st.textContent='Fotku sa nepodarilo nahrať'+(err&&err.code?` (${err.code})`:'')+'. Skús menší obrázok alebo JPG.'; }
  }
});
document.addEventListener('keydown', e=>{ if(e.key!=='Escape') return; if(S.off) closeOff(); else if(S.draft) $('#cancelbtn')?.click(); });
document.addEventListener('submit', e=>{
  if(e.target.id==='offform'){ e.preventDefault(); S.off.q = $('#offq').value; offRun(); }
  if(e.target.id==='offcode'){ e.preventDefault(); offLookupCode($('#offcodein').value); }
}, true);

async function save(opt={}){
  const d=S.draft;
  const cur = S.all.find(x=>x.id===d.id);
  if(!opt.force && !opt.copy && cur && d._base!==undefined && (cur.updatedAt||'')!==(d._base||'')){
    const by = who(cur.updatedBy);
    const at = new Date(cur.updatedAt).toLocaleTimeString('sk-SK',{hour:'2-digit',minute:'2-digit'});
    S.conflict = cur.deletedAt ? 'Recept medzitým niekto presunul do koša. Uložením ho obnovíš so svojimi zmenami.'
      : (S.me && cur.updatedBy===S.me) ? `Tento recept si o ${at} zmenil v inom okne alebo zariadení. Uložením prepíšeš tú verziu.`
      : `Recept medzitým o ${at} zmenil(a) ${by || 'niekto iný'}. Uložením prepíšeš tieto zmeny.`;
    renderSheet(false); return;
  }
  if(opt.copy){ d.id='r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); d.name=(d.name||'').trim()+' (kópia)'; d.createdAt=''; d.createdBy=''; d._base=undefined; }
  if(!d.name.trim()){ S.err='Doplň názov receptu.'; renderSheet(false); $('#f-name').focus(); return; }
  const nu={}; for(const [k,v] of Object.entries(d.nutrition)) nu[k] = String(v).trim()==='' ? '' : n(v);
  if(nu.kcal==='') nu.kcal = Math.round(n(nu.protein)*4+n(nu.carbs)*4+n(nu.fat)*9) || '';
  const now=new Date().toISOString();
  const r = {...d, name:d.name.trim(), servings:Math.max(1,n(d.servings)||1), prepMin:n(d.prepMin)||'', cookMin:n(d.cookMin)||'',
    ingredients:d.ingredients.filter(i=>String(i.name).trim()).map(i=>({...i, name:String(i.name).trim(), amount:n(i.amount)||'', measureQty:n(i.measureQty)||'', pieceG:n(i.pieceG)||'', dens:n(i.dens)||'',
      nut: hasNut(i) ? Object.fromEntries(['kcal','p','c','f','fib'].map(k=>[k, r1(n(i.nut[k]))])) : null, src:i.src||'', lookedName:i.lookedName||''})),
    steps:d.steps.map(s=>String(s).trim()).filter(Boolean), nutrition:nu, categories:rcats(d), category:rcats(d)[0]||'', types:TYPES.filter(t=>rtypes(d).includes(t)).concat(rtypes(d).filter(t=>!TYPES.includes(t))), example:false, updatedAt:now, createdAt:d.createdAt||now};
  const b=$('#savebtn'); b.disabled=true; b.textContent='Ukladám…';
  try{ await saveRecipe(r); clearStash(); S.conflict=null; S.draft=null; document.body.classList.remove('locked'); $('#sheet').innerHTML=''; go('detail', r.id); }
  catch(err){ S.err='Uloženie zlyhalo'+(err&&err.code?` (${err.code})`:'')+'. Skús to znova.'; renderSheet(false); }
}

/* ---------- vzhľad ---------- */
const HOST_THEME = document.documentElement.getAttribute('data-theme');
const THEMES = [['auto','Automaticky'],['light','Svetlý'],['dark','Tmavý']];
S.theme = (()=>{ try{ return localStorage.getItem('kucharka-theme')||'auto'; }catch(e){ return 'auto'; } })();
function effectiveDark(){ return S.theme==='dark' || (S.theme==='auto' && (HOST_THEME ? HOST_THEME==='dark' : matchMedia('(prefers-color-scheme: dark)').matches)); }
function applyTheme(){
  const el=document.documentElement;
  if(S.theme==='auto'){ if(HOST_THEME) el.setAttribute('data-theme',HOST_THEME); else el.removeAttribute('data-theme'); }
  else el.setAttribute('data-theme', S.theme);
  const m = document.querySelector('meta[name="theme-color"]'); if(m) m.content = effectiveDark() ? '#000000' : '#F2F2F7';
}
function setTheme(t){ S.theme=t; try{ localStorage.setItem('kucharka-theme',t); }catch(e){} applyTheme(); render(); }
function themeBtn(){
  const opt = (k, inner, label) => `<button type="button" data-theme-set="${k}" aria-pressed="${S.theme===k}" aria-label="${label}" title="${label}">${inner}</button>`;
  return `<div class="themeseg glass" role="group" aria-label="Vzhľad">${opt('auto','Auto','Automaticky podľa systému')}${opt('light',I.sun,'Svetlý režim')}${opt('dark',I.moon,'Tmavý režim')}</div>`;
}
applyTheme();
boot();
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
